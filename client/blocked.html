<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 4rem; background: #f7f7f7; color: #333; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); max-width: 520px; margin: auto; padding: 2rem; }
    h1 { color: #d32f2f; margin-bottom: 0.5rem; }
    p { line-height: 1.6; }
    a { color: #1976d2; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access Restricted</h1>
    <p>Your IP address has been temporarily blocked due to multiple failed login attempts.</p>
    <p>Please try again after 6 hours or from a different network.</p>
    <p>If you believe this is an error, contact the administrator.</p>
    <p><a href="/">Back to Home</a></p>
  </div>
</body>
</html>
